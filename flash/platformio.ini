; ---------------------------------------------------------------------------
; One-click flashing for cc_eye_tracker_vr
;
; Prerequisite: run build_and_flash.bat (or ./build_and_flash.sh) once so that
;
;     openiris_xiao_esp32s3_usb_cam_merged.bin
;
; exists in the repository root. This project does NOT compile anything, it
; only writes that prebuilt image.
;
; In VS Code with the PlatformIO extension:
;     PlatformIO sidebar (alien icon)
;       -> Project Tasks
;          -> xiao_esp32s3_usb_cam
;             -> Custom
;                -> "Flash cc_eye_tracker_vr firmware"    <-- click
;
; Hold BOOT on the XIAO while plugging in USB-C, then release BOOT, BEFORE
; clicking. The camera must be unplugged.
; ---------------------------------------------------------------------------

[platformio]
default_envs = xiao_esp32s3_usb_cam

[env:xiao_esp32s3_usb_cam]
platform = espressif32
board = esp32-s3-devkitc-1
upload_speed = 921600
monitor_speed = 115200
upload_port = auto
extra_scripts = extra_scripts.py
build_src_filter = -<*>
upload_protocol = esptool
