; ---------------------------------------------------------------------------
; One-click flashing for cc_eye_tracker_vr
;
; Prerequisite: run ./build.sh (Linux/macOS) or build.bat (Windows) once so that
;
;     out/openiris_xiao_esp32s3_usb_cam_merged.bin
;
; exists. This project does NOT compile anything, it only writes that prebuilt
; image with esptool. (extra_scripts.py also accepts the image loose next to
; this folder, for a flattened copy.)
;
; In VS Code with the PlatformIO extension:
;     PlatformIO sidebar (alien icon)
;       -> Project Tasks
;          -> xiao_esp32s3_usb_cam
;             -> Custom
;                -> "Flash cc_eye_tracker_vr firmware"    <-- click
;
; Hold BOOT on the XIAO while plugging in USB-C, then release BOOT, BEFORE
; clicking. The camera must be unplugged.
;
; FIRST RUN: PlatformIO downloads the espressif32 platform and its ESP32-S3
; toolchains (a few hundred MB) even though nothing is compiled. This happens
; once.
; ---------------------------------------------------------------------------

[platformio]
default_envs = xiao_esp32s3_usb_cam

[env:xiao_esp32s3_usb_cam]
platform = espressif32
board = esp32-s3-devkitc-1
; REQUIRED even though nothing is compiled: the espressif32 v7.x builder does
; `if "espidf" in env.get("PIOFRAMEWORK")`, which raises TypeError when no
; framework is declared (esp32-s3-devkitc-1 supports both arduino and espidf,
; so PlatformIO leaves PIOFRAMEWORK unset).
framework = arduino
upload_speed = 921600

; extra_scripts.py provides the "flash_openiris" custom target and rewires the
; normal Upload command. `targets` makes a plain "Build"/`pio run` flash too,
; instead of failing with "Nothing to build" (there is no src/ folder).
extra_scripts = extra_scripts.py
targets = flash_openiris

; NOTE: deliberately no `upload_port = auto`. PlatformIO does not recognise
; "auto" - it would be handed to esptool verbatim and esptool would try to open
; a port literally named "auto". Leaving upload_port unset enables
; auto-detection.
upload_protocol = esptool
